# SAIN fork config (branch sain/gemma-only, upstream pinned at b4339c640f5331ef75098637d1be2c787715ee88).
# Serves ONLY DiffusionGemma 26B-A4B (Google, Apache-2.0) as openjev-0.1 / diffusiongemma-26b.
# Removed: laya, verdict (not on SAIN-APPROVED-MODELS), clm, jevk5, clef/clef-flash (Qwen-based, banned).
# No OPENJEV_MODEL_ROUTES: the server cannot forward to any other model.
# Images are built locally from this repo (no prebuilt razorback16/* images are pulled):
#   docker build -f docker/Dockerfile.base -t sain/openjev-base:cu130-torch2.13 .
#   docker compose build && docker compose up -d
# Check: curl -s 127.0.0.1:8080/v1/models  -> only openjev-latest, openjev-0.1, diffusiongemma-26b
services:
  openjev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: {BASE_IMAGE: "sain/openjev-base:cu130-torch2.13"}
    image: sain/openjev-gemma:0.7.0-b4339c6
    environment:
      OPENJEV_BACKEND: vllm
      # Weights: the founder picks one (see _sainos-plan/OPENJEV-GEMMA-CHECK.md, item 2):
      #   nvidia/diffusiongemma-26B-A4B-it-NVFP4 @ ec4ff3df... (default; ~18 GB; calibrated by NVIDIA, see check)
      #   google/diffusiongemma-26B-A4B-it      @ f7f5b7f5... (bf16, ~52 GB; needs a 96 GB+ GPU, e.g. Spark / RTX PRO 6000)
      OPENJEV_MODEL: ${OPENJEV_MODEL:-nvidia/diffusiongemma-26B-A4B-it-NVFP4}
      OPENJEV_VLLM_ARGS: ${OPENJEV_VLLM_ARGS:---revision ec4ff3df205028f4e81c954c2227f9312b3ec2ea --tokenizer-revision ec4ff3df205028f4e81c954c2227f9312b3ec2ea}
      OPENJEV_CANVAS: "64"
      OPENJEV_MAX_NUM_SEQS: ${OPENJEV_MAX_NUM_SEQS:-64}
      OPENJEV_MAX_MODEL_LEN: ${OPENJEV_MAX_MODEL_LEN:-65536}
      OPENJEV_GPU_UTIL: ${OPENJEV_GPU_UTIL:-0.9}
      OPENJEV_API_KEY: ${OPENJEV_API_KEY:-}
      OPENJEV_ORIGIN_SECRET: ${OPENJEV_ORIGIN_SECRET:-}
      OPENJEV_MODEL_ROUTES: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
      - flashinfer-cache:/root/.cache/flashinfer   # NVFP4 MoE kernels, compiled on first start (about 4 min)
    ports:
      - "${OPENJEV_BIND:-127.0.0.1}:8080:8080"
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: unless-stopped

volumes:
  vllm-cache:
  flashinfer-cache:
